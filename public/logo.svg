<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="connect-c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="connect-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="logo-c-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Badge Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#connect-bg-grad)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
  
  <!-- Outer Subtle Glow Ring -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="url(#connect-c-grad)" stroke-width="1.5" opacity="0.25"/>

  <!-- Stylized Tick Mark in the Shape of 'C' -->
  <path d="M 76 36 C 42 22 24 50 28 72 C 32 88 44 94 54 84 L 86 40" 
        fill="none" 
        stroke="url(#connect-c-grad)" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#logo-c-glow)"/>

  <!-- Small Glowing Accent Dot -->
  <circle cx="86" cy="40" r="3.5" fill="#ffffff" filter="url(#logo-c-glow)"/>
</svg>
