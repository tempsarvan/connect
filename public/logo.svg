<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="54" fill="#09090b" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Outer Pulsing Orbit Ring -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="url(#logo-grad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.65"/>
  
  <!-- Connection Network Nodes & Links -->
  <line x1="38" y1="44" x2="60" y2="76" stroke="url(#logo-grad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="82" y1="44" x2="60" y2="76" stroke="url(#logo-grad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="38" y1="44" x2="82" y2="44" stroke="url(#logo-grad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Nodes -->
  <circle cx="38" cy="44" r="8" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="82" cy="44" r="8" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="60" cy="76" r="10" fill="url(#logo-grad)" filter="url(#glow)"/>
  <circle cx="60" cy="76" r="4" fill="#ffffff"/>
</svg>
